name: Verify Baatly Partner Keystore

'on':
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          KEYSTORE_FILE="$RUNNER_TEMP/baatly-partner-upload.jks"

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Verify keystore password and alias
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -e

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -alias upload

          echo "SUCCESS: Store password and alias 'upload' are valid."

      - name: Verify private key password
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          TMP_EXPORT="$RUNNER_TEMP/baatly-test-key.pem"

          keytool -importkeystore \
            -srckeystore "$KEYSTORE_FILE" \
            -srcstoretype JKS \
            -srcstorepass "$STORE_PASSWORD" \
            -srcalias upload \
            -srckeypass "$KEY_PASSWORD" \
            -destkeystore "$RUNNER_TEMP/test.p12" \
            -deststoretype PKCS12 \
            -deststorepass "$STORE_PASSWORD" \
            -destkeypass "$STORE_PASSWORD" \
            -noprompt \
            >/dev/null

          echo "SUCCESS: Private key password is valid."
          echo "SUCCESS: The 'upload' private key can be read."
          echo "KEYSTORE VERIFICATION PASSED."

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/baatly-partner-upload.jks"
          rm -f "$RUNNER_TEMP/test.p12"
          rm -f "$RUNNER_TEMP/baatly-test-key.pem"
