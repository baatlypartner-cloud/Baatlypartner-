name: Verify Baatly Partner Keystore

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          KEYSTORE_FILE="$RUNNER_TEMP/baatly-partner-upload.jks"

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

          echo "Keystore file created successfully."

      - name: Verify keystore password and alias
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -e

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: STORE_PASSWORD secret is missing."
            exit 1
          fi

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -alias upload

          echo "SUCCESS: Store password is valid."
          echo "SUCCESS: Alias 'upload' exists."

      - name: Verify private key password
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          TEST_KEYSTORE="$RUNNER_TEMP/test-upload.p12"

          keytool -importkeystore \
            -srckeystore "$KEYSTORE_FILE" \
            -srcstoretype JKS \
            -srcstorepass "$STORE_PASSWORD" \
            -srcalias upload \
            -srckeypass "$KEY_PASSWORD" \
            -destkeystore "$TEST_KEYSTORE" \
            -deststoretype PKCS12 \
            -deststorepass "$STORE_PASSWORD" \
            -destkeypass "$STORE_PASSWORD" \
            -noprompt

          echo "SUCCESS: Private key password is valid."
          echo "SUCCESS: Upload key can be read."
          echo "KEYSTORE VERIFICATION PASSED."

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/baatly-partner-upload.jks"
          rm -f "$RUNNER_TEMP/test-upload.p12"
