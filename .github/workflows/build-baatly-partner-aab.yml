name: Build Baatly Partner Release AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-partner-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find source ZIP
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -type f -iname '*.zip' ! -path './.git/*' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Partner source ZIP not found in repository."
            exit 1
          fi

          echo "Source ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q "${{ steps.find_zip.outputs.zip_file }}" -d extracted

          echo "Extracted source:"
          find extracted -maxdepth 3 -type f | head -150

      - name: Locate Android project
        id: locate_project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find extracted -type f \( \
            -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \
          \) | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew not found in Android project directory."
            echo "Project directory: $PROJECT_DIR"
            exit 1
          fi

          echo "Android project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/baatly-partner-release.jks"

          if [ ! -s "$RUNNER_TEMP/baatly-partner-release.jks" ]; then
            echo "ERROR: Keystore decoding failed."
            exit 1
          fi

          echo "Release keystore decoded successfully."

      - name: Prepare Gradle wrapper
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew

      - name: Build signed Release AAB
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/baatly-partner-release.jks
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "${STORE_PASSWORD:-}" ]; then
            echo "ERROR: STORE_PASSWORD secret is missing."
            exit 1
          fi

          ./gradlew clean bundleRelease --no-daemon --stacktrace

      - name: Find generated AAB
        id: find_aab
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          AAB_FILE="$(find . \
            -type f \
            -path '*/build/outputs/bundle/*/*.aab' \
            | head -n 1)"

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: Release AAB was not generated."
            exit 1
          fi

          echo "Generated AAB: $AAB_FILE"
          echo "aab_file=$AAB_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload Partner AAB
        uses: actions/upload-artifact@v4
        with:
          name: baatly-partner-release-aab
          path: ${{ steps.locate_project.outputs.project_dir }}/${{ steps.find_aab.outputs.aab_file }}
          if-no-files-found: error

      - name: Upload mapping files
        uses: actions/upload-artifact@v4
        with:
          name: baatly-partner-mapping-files
          path: |
            ${{ steps.locate_project.outputs.project_dir }}/**/build/outputs/mapping/**
          if-no-files-found: ignore
