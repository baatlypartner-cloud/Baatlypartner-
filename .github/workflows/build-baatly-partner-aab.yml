 name: Baatly Partner AAB Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort | head -300

      - name: Find Partner ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            \( -iname "*.zip" \) \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Partner ZIP
        shell: bash
        run: |
          set -e

          rm -rf source
          mkdir -p source

          unzip -q "${{ steps.zip.outputs.zip_file }}" -d source

          echo "ZIP extracted successfully."
          find source -maxdepth 4 -type f | sort | head -300

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          GRADLEW=$(find source -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: STORE_PASSWORD secret is missing."
            exit 1
          fi

          echo "All required signing secrets are available."

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -e

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/baatly-partner-release.jks"

          test -s "$RUNNER_TEMP/baatly-partner-release.jks"

          echo "Keystore decoded successfully."

      - name: Make Gradle executable
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          chmod +x ./gradlew

      - name: Build Release AAB
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/baatly-partner-release.jks
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        shell: bash
        run: |
          set -e

          ./gradlew clean bundleRelease \
            --no-daemon \
            --stacktrace

      - name: Find AAB
        id: aab
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          AAB=$(find . -type f \
            -path "*/build/outputs/bundle/*/*.aab" \
            | head -n 1)

          if [ -z "$AAB" ]; then
            echo "ERROR: No AAB file was generated."
            exit 1
          fi

          echo "AAB found: $AAB"
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: baatly-partner-release-aab
          path: ${{ steps.project.outputs.project_dir }}/${{ steps.aab.outputs.aab }}
          if-no-files-found: error

      - name: Build completed
        run: |
          echo "======================================"
          echo " BAATLY PARTNER AAB BUILD SUCCESSFUL "
          echo "======================================"
