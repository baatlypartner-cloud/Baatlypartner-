name: Baatly Partner App AAB

on:
  push: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build Baatly Partner Release AAB
    runs-on: ubuntu-latest

    env:
      SOURCE_ZIP: "baatly-partner (6) (14).zip"
      PROJECT_DIR: "baatly-partner-source"

    steps:

      # =====================================================
      # 1. Checkout repository
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # =====================================================
      # 2. Setup Java 17
      # IMPORTANT:
      # No Gradle cache here because the Android project
      # is inside the uploaded ZIP.
      # =====================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # =====================================================
      # 3. Verify source ZIP
      # =====================================================
      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Partner App ZIP..."

          if [[ ! -f "$SOURCE_ZIP" ]]; then
            echo "ERROR: Partner App ZIP not found."
            echo ""
            echo "Expected:"
            echo "$SOURCE_ZIP"
            echo ""
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -iname "*.zip" -print || true
            exit 1
          fi

          echo ""
          echo "Partner ZIP found:"
          ls -lh "$SOURCE_ZIP"

      # =====================================================
      # 4. Extract Partner project
      # =====================================================
      - name: Extract Partner project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"

          unzip -q "$SOURCE_ZIP" -d "$PROJECT_DIR"

          echo "Partner project extracted."

          echo ""
          echo "Extracted files:"
          find "$PROJECT_DIR" -maxdepth 2 -type f -print | sort | head -200

      # =====================================================
      # 5. Detect Gradle project root
      # =====================================================
      - name: Detect Partner Gradle project
        shell: bash
        run: |
          set -euo pipefail

          FOUND_GRADLEW="$(find "$PROJECT_DIR" \
            -type f \
            -name "gradlew" \
            -print -quit)"

          if [[ -z "$FOUND_GRADLEW" ]]; then
            echo "ERROR: gradlew was not found inside Partner ZIP."
            exit 1
          fi

          DETECTED_ROOT="$(dirname "$FOUND_GRADLEW")"

          echo "Detected Gradle project root:"
          echo "$DETECTED_ROOT"

          if [[ ! -f "$DETECTED_ROOT/settings.gradle.kts" ]] && \
             [[ ! -f "$DETECTED_ROOT/settings.gradle" ]]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          if [[ ! -f "$DETECTED_ROOT/app/build.gradle.kts" ]] && \
             [[ ! -f "$DETECTED_ROOT/app/build.gradle" ]]; then
            echo "ERROR: app Gradle build file not found."
            exit 1
          fi

          echo "$DETECTED_ROOT" > project_root.txt

          echo ""
          echo "Partner project verified."

      # =====================================================
      # 6. Prepare Gradle wrapper
      # =====================================================
      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat project_root.txt)"

          chmod +x "$PROJECT_ROOT/gradlew"

          echo "Gradle wrapper prepared."

      # =====================================================
      # 7. Create .env from GitHub Secrets
      # =====================================================
      - name: Create production environment
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat project_root.txt)"

          if [[ -z "${SUPABASE_URL:-}" ]]; then
            echo "ERROR: SUPABASE_URL secret is missing."
            exit 1
          fi

          if [[ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]]; then
            echo "ERROR: SUPABASE_PUBLISHABLE_KEY secret is missing."
            exit 1
          fi

          if [[ -z "${AGORA_APP_ID:-}" ]]; then
            echo "ERROR: AGORA_APP_ID secret is missing."
            exit 1
          fi

          printf '%s\n' \
            "SUPABASE_URL=$SUPABASE_URL" \
            "SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY" \
            "AGORA_APP_ID=$AGORA_APP_ID" \
            > "$PROJECT_ROOT/.env"

          chmod 600 "$PROJECT_ROOT/.env"

          echo ".env created successfully."

      # =====================================================
      # 8. Prepare release keystore
      # =====================================================
      - name: Prepare release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat project_root.txt)"

          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > \
            "$PROJECT_ROOT/my-upload-key.jks"

          if [[ ! -s "$PROJECT_ROOT/my-upload-key.jks" ]]; then
            echo "ERROR: Keystore was not created correctly."
            exit 1
          fi

          echo "Release keystore prepared."

      # =====================================================
      # 9. Verify signing secrets
      # =====================================================
      - name: Verify signing configuration
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/baatly-partner-source/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ ! -f "$KEYSTORE_PATH" ]]; then
            echo "ERROR: Release keystore not found."
            exit 1
          fi

          if [[ -z "${STORE_PASSWORD:-}" ]]; then
            echo "ERROR: STORE_PASSWORD secret is missing."
            exit 1
          fi

          if [[ -z "${KEY_PASSWORD:-}" ]]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "Signing configuration is ready."

      # =====================================================
      # 10. Verify Java and Gradle
      # =====================================================
      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat project_root.txt)"

          echo "Java version:"
          java -version

          echo ""
          echo "Gradle version:"

          cd "$PROJECT_ROOT"
          ./gradlew --version

      # =====================================================
      # 11. Build signed release AAB
      # =====================================================
      - name: Build signed Partner release AAB
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/baatly-partner-source/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat project_root.txt)"

          cd "$PROJECT_ROOT"

          echo "Starting Partner release build..."

          ./gradlew clean bundleRelease \
            --no-daemon \
            --stacktrace

      # =====================================================
      # 12. Locate generated AAB
      # =====================================================
      - name: Locate generated AAB
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat project_root.txt)"

          AAB_FILE="$(find "$PROJECT_ROOT/app/build/outputs/bundle" \
            -type f \
            -name "*.aab" \
            -print -quit)"

          if [[ -z "$AAB_FILE" ]]; then
            echo "ERROR: No AAB was generated."

            echo ""
            echo "Build output:"
            find "$PROJECT_ROOT/app/build/outputs" \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo "AAB found:"
          echo "$AAB_FILE"

          cp "$AAB_FILE" "$GITHUB_WORKSPACE/baatly-partner-release.aab"

      # =====================================================
      # 13. Verify final AAB
      # =====================================================
      - name: Verify final AAB
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "baatly-partner-release.aab" ]]; then
            echo "ERROR: Final Partner AAB not found."
            exit 1
          fi

          echo "Final Partner AAB:"
          ls -lh baatly-partner-release.aab

      # =====================================================
      # 14. Upload AAB artifact
      # =====================================================
      - name: Upload Partner AAB
        uses: actions/upload-artifact@v4
        with:
          name: baatly-partner-release-aab
          path: baatly-partner-release.aab
          if-no-files-found: error
          retention-days: 30

      # =====================================================
      # 15. Cleanup sensitive files
      # =====================================================
      - name: Cleanup sensitive files
        if: always()
        shell: bash
        run: |
          PROJECT_ROOT="$(cat project_root.txt 2>/dev/null || true)"

          if [[ -n "$PROJECT_ROOT" ]]; then
            rm -f "$PROJECT_ROOT/my-upload-key.jks" || true
            rm -f "$PROJECT_ROOT/.env" || true
          fi

          echo "Cleanup completed." 
