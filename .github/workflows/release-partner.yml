name: BAATLY Partner APK and AAB Build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: partner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Partner APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Find Android Project and Gradle Wrapper
        shell: bash
        run: |
          WRAPPER=$(find . -type f -name gradlew \
            -not -path '*/.git/*' \
            -not -path '*/build/*' \
            -not -path '*/.gradle/*' \
            -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "::error::gradlew not found. Android Gradle Wrapper must be included in the repository."
            echo "Repository files:"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")

          if [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::error::gradle-wrapper.properties missing."
            exit 1
          fi

          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          chmod +x "$WRAPPER"

          echo "Android project found: $PROJECT_DIR"

      - name: Build Release APK and AAB
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:assembleRelease \
            :app:bundleRelease
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: upload

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v7
        with:
          name: BAATLY-Partner-${{ github.run_number }}
          path: |
            ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
            ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: BAATLY Partner ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
            ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
