name: BAATLY Partner APK and AAB Build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: partner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Partner APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and Extract Partner ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -t ZIP_FILES < <(
            find "$GITHUB_WORKSPACE" -type f -iname '*partner*.zip' \
              -not -path '*/.git/*' \
              -not -path '*/.github/*' \
              -not -path '*/.partner-build-src/*' \
              | sort
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            mapfile -t ZIP_FILES < <(
              find "$GITHUB_WORKSPACE" -type f -iname '*.zip' \
                -not -path '*/.git/*' \
                -not -path '*/.github/*' \
                -not -path '*/.partner-build-src/*' \
                | sort
            )
          fi

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "::error::Repository में एक ही Partner ZIP होनी चाहिए। मिलीं: ${#ZIP_FILES[@]}"
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          ZIP_FILE="${ZIP_FILES[0]}"
          EXTRACT_DIR="$GITHUB_WORKSPACE/.partner-build-src"

          echo "ZIP found: $ZIP_FILE"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          WRAPPER_PATH=$(find "$EXTRACT_DIR" -type f -name gradlew \
            -not -path '*/build/*' -print -quit)

          if [ -z "$WRAPPER_PATH" ]; then
            echo "::error::ZIP के अंदर gradlew नहीं मिला।"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER_PATH")

          if [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::error::Gradle wrapper properties missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle.kts नहीं मिला।"
            exit 1
          fi

          chmod +x "$WRAPPER_PATH"

          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Signing Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail

          KEYSTORE="$ANDROID_PROJECT_DIR/my-upload-key.jks"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          fi

          if [ ! -f "$KEYSTORE" ]; then
            echo "::error::Signing keystore नहीं मिली।"
            exit 1
          fi

          if [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::STORE_PASSWORD या KEY_PASSWORD secret missing है।"
            exit 1
          fi

      - name: Build Release APK and AAB
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ env.ANDROID_PROJECT_DIR }}/my-upload-key.jks
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:assembleRelease \
            :app:bundleRelease

      - name: Upload APK and AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BAATLY-Partner-${{ github.run_number }}
          path: |
            ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
            ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: BAATLY Partner ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
            ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
