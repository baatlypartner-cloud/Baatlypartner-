name: BAATLY Partner Signed Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.2.0)'
        required: true
        type: string
        default: 'v1.2.0'

permissions:
  contents: write

concurrency:
  group: baatly-partner-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare Maps .env and release keystore
        shell: bash
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail

          : "${MAPS_API_KEY:?Missing MAPS_API_KEY}"
          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64}"
          : "${STORE_PASSWORD:?Missing STORE_PASSWORD}"

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          example = Path('.env.example').read_text(encoding='utf-8')
          maps_key = os.environ['MAPS_API_KEY'].strip()

          updated, count = re.subn(
              r'(?m)^MAPS_API_KEY=.*$',
              'MAPS_API_KEY=' + maps_key,
              example
          )

          if count != 1:
              raise SystemExit('MAPS_API_KEY entry not found')

          Path('.env').write_text(updated, encoding='utf-8')
          Path('.env').chmod(0o600)
          PY

          KEYSTORE_FILE="$RUNNER_TEMP/baatly-upload-key.jks"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$STORE_PASSWORD" \
            -alias upload >/dev/null

      - name: Resolve release version
        id: release_meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"

          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)"

          if [[ -z "$VERSION_NAME" || -z "$VERSION_CODE" ]]; then
            echo "Could not read app version"
            exit 1
          fi

          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            RELEASE_TAG="$INPUT_RELEASE_TAG"
          else
            RELEASE_TAG="$REF_NAME"
          fi

          if [[ "$RELEASE_TAG" != "v$VERSION_NAME" ]]; then
            echo "Release tag does not match app version"
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build signed APK and AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/baatly-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          : "${KEY_PASSWORD:?Missing KEY_PASSWORD}"

          ./gradlew --no-daemon --stacktrace clean \
            :app:testReleaseUnitTest \
            :app:assembleRelease \
            :app:bundleRelease

      - name: Prepare release files
        id: package_release
        shell: bash
        env:
          VERSION_NAME: ${{ steps.release_meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.release_meta.outputs.version_code }}
        run: |
          set -euo pipefail

          mkdir -p dist

          APK_SOURCE='app/build/outputs/apk/release/app-release.apk'
          AAB_SOURCE='app/build/outputs/bundle/release/app-release.aab'

          test -s "$APK_SOURCE"
          test -s "$AAB_SOURCE"

          APK_NAME="BAATLY-Partner-${VERSION_NAME}-code${VERSION_CODE}-release.apk"
          AAB_NAME="BAATLY-Partner-${VERSION_NAME}-code${VERSION_CODE}-release.aab"

          cp "$APK_SOURCE" "dist/$APK_NAME"
          cp "$AAB_SOURCE" "dist/$AAB_NAME"

          cd dist
          sha256sum "$APK_NAME" "$AAB_NAME" > SHA256SUMS.txt
          cd ..

          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "aab_name=$AAB_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BAATLY Partner ${{ steps.release_meta.outputs.version_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/${{ steps.package_release.outputs.apk_name }}
            dist/${{ steps.package_release.outputs.aab_name }}
            dist/SHA256SUMS.txt
