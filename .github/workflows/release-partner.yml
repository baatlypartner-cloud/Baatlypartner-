name: Build BAATLY Partner APK and AAB

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: partner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Partner APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find and Extract Partner ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -t ZIP_FILES < <(
            find "$GITHUB_WORKSPACE" \
              -type f -iname '*partner*.zip' \
              -not -path '*/.git/*' \
              -not -path '*/.partner-build-src/*' \
              | sort
          )

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "::error::Exactly one Partner ZIP is required."
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          EXTRACT_DIR="$GITHUB_WORKSPACE/.partner-build-src"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          unzip -q "${ZIP_FILES[0]}" -d "$EXTRACT_DIR"

          WRAPPER=$(find "$EXTRACT_DIR" \
            -type f -name gradlew \
            -not -path '*/build/*' \
            -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "::error::gradlew missing inside ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"

          test -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/.env.example"

          chmod +x "$WRAPPER"

          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found: $PROJECT_DIR"

      - name: Prepare Maps Configuration
        shell: bash
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          set -Eeuo pipefail

          if [ -z "${MAPS_API_KEY:-}" ]; then
            echo "::error::MAPS_API_KEY secret missing."
            exit 1
          fi

          cp "$ANDROID_PROJECT_DIR/.env.example" \
             "$ANDROID_PROJECT_DIR/.env"

          python3 - "$ANDROID_PROJECT_DIR/.env" "$MAPS_API_KEY" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          key = sys.argv[2]

          lines = path.read_text().splitlines()
          output = []
          replaced = False

          for line in lines:
              if line.startswith("MAPS_API_KEY="):
                  output.append("MAPS_API_KEY=" + key)
                  replaced = True
              else:
                  output.append(line)

          if not replaced:
              output.append("MAPS_API_KEY=" + key)

          path.write_text("\n".join(output) + "\n")
          PY

      - name: Kotlin Release Compilation
        id: kotlin_compile
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        shell: bash
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          set -o pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --info \
            :app:compileReleaseKotlin \
            2>&1 | tee "$GITHUB_WORKSPACE/kotlin-error.log"

      - name: Upload Kotlin Error Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BAATLY-Kotlin-Diagnostics-${{ github.run_number }}
          path: ${{ github.workspace }}/kotlin-error.log
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare Release Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail

          for secret_name in \
            KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD
          do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Missing secret: $secret_name"
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$ANDROID_PROJECT_DIR/my-upload-key.jks"

          test -s "$ANDROID_PROJECT_DIR/my-upload-key.jks"

      - name: Build Release APK and AAB
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          KEYSTORE_PATH: ${{ env.ANDROID_PROJECT_DIR }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease \
            :app:bundleRelease

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: BAATLY-Partner-${{ github.run_number }}
          path: |
            ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
            ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: BAATLY Partner ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
            ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
